<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- Deviates from Tap2Card/Design/Logo/handshake-logo-weiss.svg on purpose: the
       source carries its own rounded corners and a transparent margin, which read
       as an icon sitting inside the tile. Full-bleed and square here, so the
       .project__mark tile does the rounding and both app icons crop identically. -->
